{
  "version": "1.3.13",
  "cache": true,
  "endpoints": {
    "custom": [
      {
        "name": "OpenRouter",
        "apiKey": "${OPENROUTER_KEY}",
        "baseURL": "https://openrouter.ai/api/v1",
        "models": {
          "default": [
            "qwen/qwen3.8-flash",
            "~deepseek/deepseek-flash-latest"
          ],
          "fetch": false
        },
        "titleConvo": false
      }
    ]
  },
  "modelSpecs": {
    "enforce": true,
    "prioritize": true,
    "list": [
      {
        "name": "qwen-flash",
        "label": "Qwen Flash",
        "default": true,
        "preset": {
          "endpoint": "OpenRouter",
          "model": "qwen/qwen3.8-flash"
        }
      },
      {
        "name": "deepseek-flash",
        "label": "DeepSeek Flash",
        "preset": {
          "endpoint": "OpenRouter",
          "model": "~deepseek/deepseek-flash-latest"
        }
      }
    ]
  }
}
