---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-portal-openrouter-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
data:
  start.sh: |
    #!/bin/sh
    set -eu
    resolver="$(awk '$1 == "nameserver" {print $2; exit}' /etc/resolv.conf)"
    case "$resolver" in
      ''|*[!0-9.]*) echo 'expected an IPv4 cluster resolver' >&2; exit 1 ;;
    esac
    sed "s/__DNS_SERVER__/$resolver/" /config/nginx.conf.template >/tmp/nginx.conf
    exec nginx -c /tmp/nginx.conf -g 'daemon off;'
  nginx.conf.template: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      resolver __DNS_SERVER__ ipv6=off valid=300s;
      resolver_timeout 5s;
      server {
        listen 8080;
        server_name _;
        set $openrouter_host openrouter.ai;
        location = /healthz {
          access_log off;
          add_header Content-Type text/plain;
          return 200 "ok\n";
        }
        location = /api/v1/models {
          limit_except GET { deny all; }
          proxy_pass https://$openrouter_host;
          proxy_set_header Host openrouter.ai;
          proxy_set_header Connection "";
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_ssl_name openrouter.ai;
          proxy_ssl_verify on;
          proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
          proxy_buffering off;
          proxy_connect_timeout 10s;
          proxy_read_timeout 300s;
        }
        location = /api/v1/chat/completions {
          limit_except POST { deny all; }
          proxy_pass https://$openrouter_host;
          proxy_set_header Host openrouter.ai;
          proxy_set_header Connection "";
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_ssl_name openrouter.ai;
          proxy_ssl_verify on;
          proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
          proxy_buffering off;
          proxy_connect_timeout 10s;
          proxy_read_timeout 300s;
        }
        location / { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-portal-openrouter-egress
  annotations: {argocd.argoproj.io/sync-wave: "-10"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ai-portal-openrouter-egress}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-portal-openrouter-egress
        app.kubernetes.io/component: openrouter-egress
        app.kubernetes.io/part-of: ai-portal
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: nginxinc/nginx-unprivileged:1.29.3-alpine@sha256:5aea7cc516b419e3526f47dd1531be31a56a046cfe44754d94f9383e13e2ee99
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /config/start.sh]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: ai-portal-openrouter-egress, defaultMode: 0555}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-portal-openrouter-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ai-portal-openrouter-egress}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
