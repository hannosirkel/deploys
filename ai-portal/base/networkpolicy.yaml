---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-ingress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: mongodb}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [chat, backup, recovery, bootstrap]
      ports:
        - {port: 27017, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [chat, backup, recovery, bootstrap]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: mongodb}
      ports:
        - {port: 27017, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chat-portal-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: chat}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: portal}
      ports:
        - {port: 3080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chat-authentik-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: chat}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: authentik}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
      ports:
        - {port: 9443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-https-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: backup}
  policyTypes: [Egress]
  egress:
    - to:
        # All Backblaze B2 traffic uses these published IPv4 ranges.
        # Verify against https://www.backblaze.com/computer-backup/docs/backblaze-ip-addresses
        # before a B2 endpoint or routing change (checked 2026-09-23).
        - ipBlock: {cidr: 45.11.36.0/22}
        - ipBlock: {cidr: 104.153.232.0/21}
        - ipBlock: {cidr: 149.137.128.0/20}
        - ipBlock: {cidr: 206.190.208.0/21}
        - ipBlock: {cidr: 207.166.148.0/22}
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openrouter-egress-ingress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: openrouter-egress}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: chat}
      ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chat-openrouter-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: chat}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: openrouter-egress}
      ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openrouter-https-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: openrouter-egress}
  policyTypes: [Egress]
  # OpenRouter currently resolves inside Cloudflare's published IPv4 ranges.
  # Hostname/path enforcement is in the fixed reverse proxy, not this CIDR rule.
  egress:
    - to:
        - ipBlock: {cidr: 173.245.48.0/20}
        - ipBlock: {cidr: 103.21.244.0/22}
        - ipBlock: {cidr: 103.22.200.0/22}
        - ipBlock: {cidr: 103.31.4.0/22}
        - ipBlock: {cidr: 141.101.64.0/18}
        - ipBlock: {cidr: 108.162.192.0/18}
        - ipBlock: {cidr: 190.93.240.0/20}
        - ipBlock: {cidr: 188.114.96.0/20}
        - ipBlock: {cidr: 197.234.240.0/22}
        - ipBlock: {cidr: 198.41.128.0/17}
        - ipBlock: {cidr: 162.158.0.0/15}
        - ipBlock: {cidr: 104.16.0.0/13}
        - ipBlock: {cidr: 104.24.0.0/14}
        - ipBlock: {cidr: 172.64.0.0/13}
        - ipBlock: {cidr: 131.0.72.0/22}
      ports:
        - {port: 443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-internal-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: portal}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: authentik}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
      ports:
        - {port: 9443, protocol: TCP}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: chat}
      ports:
        - {port: 3080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-tunnel-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: portal}
  policyTypes: [Ingress]
  # Orange patches the observed host/node source range at activation.
  # NetworkPolicy cannot distinguish cloudflared from other local host processes.
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-access-jwks-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: portal}
  policyTypes: [Egress]
  # Cloudflare's published IPv4 proxy ranges, checked 2026-09-23.
  # The app fetches Access signing keys over HTTPS from its team domain.
  egress:
    - to:
        - ipBlock: {cidr: 173.245.48.0/20}
        - ipBlock: {cidr: 103.21.244.0/22}
        - ipBlock: {cidr: 103.22.200.0/22}
        - ipBlock: {cidr: 103.31.4.0/22}
        - ipBlock: {cidr: 141.101.64.0/18}
        - ipBlock: {cidr: 108.162.192.0/18}
        - ipBlock: {cidr: 190.93.240.0/20}
        - ipBlock: {cidr: 188.114.96.0/20}
        - ipBlock: {cidr: 197.234.240.0/22}
        - ipBlock: {cidr: 198.41.128.0/17}
        - ipBlock: {cidr: 162.158.0.0/15}
        - ipBlock: {cidr: 104.16.0.0/13}
        - ipBlock: {cidr: 104.24.0.0/14}
        - ipBlock: {cidr: 172.64.0.0/13}
        - ipBlock: {cidr: 131.0.72.0/22}
      ports:
        - {port: 443, protocol: TCP}
