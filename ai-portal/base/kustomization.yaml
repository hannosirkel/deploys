apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - portal.yaml
  - mongodb.yaml
  - librechat-runtime.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: ai-portal-librechat-policy
    files:
      - librechat.yaml
      - admin-override.json
generatorOptions:
  disableNameSuffixHash: true
