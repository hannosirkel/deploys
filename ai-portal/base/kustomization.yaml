apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - portal.yaml
  - mongodb.yaml
  - librechat-runtime.yaml
  - librechat-bootstrap.yaml
  - openrouter-egress.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: ai-portal-librechat-policy
    files:
      - librechat.yaml
      - admin-override.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
