---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-portal-mongodb-init
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
data:
  10-librechat-user.js: |
    db.createUser({
      user: "librechat",
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{role: "readWrite", db: "LibreChat"}]
    });
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-portal-mongodb
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-portal-mongodb
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  replicas: 0
  serviceName: ai-portal-mongodb
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-portal-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-portal-mongodb
        app.kubernetes.io/component: mongodb
        app.kubernetes.io/part-of: ai-portal
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongodb
          image: mongo:8.0.32@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
          imagePullPolicy: IfNotPresent
          args:
            - mongod
            - --bind_ip_all
            - --dbpath=/data/db
            - --wiredTigerCacheSizeGB=0.25
          ports:
            - {name: mongodb, containerPort: 27017, protocol: TCP}
          env:
            - {name: HOME, value: /tmp}
            - {name: TMPDIR, value: /tmp}
            - {name: MONGO_INITDB_DATABASE, value: LibreChat}
            - {name: MONGO_INITDB_ROOT_USERNAME, value: admin}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: ai-portal-mongodb, key: root-password}
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: ai-portal-mongodb, key: app-password}
          startupProbe:
            exec: &authenticated-ping
              command:
                - bash
                - -ec
                - >-
                  mongosh --quiet --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: *authenticated-ping
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: *authenticated-ping
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ai-portal-mongodb}
        - name: init
          configMap: {name: ai-portal-mongodb-init}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-portal-mongodb
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-portal-mongodb
  ports:
    - {name: mongodb, port: 27017, targetPort: mongodb, protocol: TCP}
