---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lousydeal-worker
  labels: &labels
    app.kubernetes.io/name: lousydeal-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lousydeal
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  # Pinned rather than left to the apiserver default: the readiness comment
  # below depends on `maxUnavailable: 0` at this replica count (a new pod
  # must turn Ready before the old one retires), and an unset `strategy:`
  # only produces that value because 25%/25% of one replica rounds down to
  # zero -- true today, but a value this comment relies on rather than one
  # this manifest states. `tests/manifests.sh` asserts this block.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: lousydeal-worker
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/hannosirkel/lousydeal-backend:unpublished
          imagePullPolicy: IfNotPresent
          # Same image, same `args` as `backend.yaml` -- see that file for why
          # there is no `start:worker` script to name here. `MEDUSA_WORKER_MODE`
          # below is the only thing that distinguishes this pod from the API:
          # `worker` mode runs subscribers, scheduled jobs and workflow-engine
          # steps, not the Store/Admin API.
          #
          # It still binds :9000 and answers /health, though -- this file
          # previously claimed it "serves no HTTP request", and that was never
          # measured. T13b ran `localhost/lousydeal-backend:t11` with
          # `MEDUSA_WORKER_MODE=worker` against a real PostgreSQL and Redis:
          # `Server is ready on port: 9000` logged in every run, `/health`
          # answered `200 OK`, and every other path tried -- `/app` and
          # `/app/login` included -- answered `404`. `start.js:245-248`
          # registers `/health` and calls `http_.listen(port, host)` on the one
          # code path both modes share; `:284-331` only forks a cluster child
          # differently, and this Deployment does not pass `--cluster`. See
          # `lousydeal/README.md` for the full run.
          args: [npm, run, start]
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - {name: MEDUSA_WORKER_MODE, value: worker}
            - {name: STORE_OPEN, value: "false"}
            - {name: DATABASE_HOST, value: lousydeal-postgresql}
            - {name: DATABASE_PORT, value: "5432"}
            - {name: DATABASE_NAME, value: lousydeal}
            - {name: DATABASE_USER, value: medusa}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: lousydeal-runtime-credentials, key: DATABASE_PASSWORD}}
            - {name: REDIS_HOST, value: lousydeal-redis}
            - {name: REDIS_PORT, value: "6379"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: lousydeal-runtime-credentials, key: REDIS_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: lousydeal-runtime-credentials, key: JWT_SECRET}}
            - name: COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: lousydeal-runtime-credentials, key: COOKIE_SECRET}}
            - name: STRIPE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: lousydeal-runtime-credentials, key: STRIPE_SECRET_KEY}}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: lousydeal-runtime-credentials, key: STRIPE_WEBHOOK_SECRET}}
            - name: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID
              valueFrom: {secretKeyRef: {name: lousydeal-runtime-credentials, key: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID, optional: true}}
            # The trader's identity, for the § 55(1)-(2) order confirmation.
            # C9's `backend/src/config/merchant.ts` reads the same six
            # variables the storefront reads, from the same private inventory:
            # decision `004` puts the identity in runtime configuration so that
            # neither workspace carries it as a literal, and Orange's
            # Application patches over all six at deploy time.
            #
            # **These are the fallback and not the authoritative source**, in
            # exactly the sense `storefront.yaml` says so at greater length --
            # the values there and here are one fact, and a difference between
            # them is a defect rather than a configuration. Real values rather
            # than placeholders, for the reason that file gives: they are
            # public business-register facts and a role address, they are the
            # same in both environments because there is one company, and a
            # manifest applied without Orange should be able to name its own
            # trader rather than refuse to.
            #
            # An incomplete set sends nothing rather than something deficient:
            # `readMerchantIdentity` answers `null` for any missing field and
            # `buildOrderConfirmation` refuses to build from `null`. § 55(2) is
            # not satisfied by a confirmation that names no trader.
            - {name: MERCHANT_LEGAL_NAME, value: "Aislopica OÜ"}
            - {name: MERCHANT_ADDRESS, value: "Pihlaka tn 2, Jüri alevik, Rae vald, Harju maakond, 75301, Estonia"}
            - {name: MERCHANT_EMAIL, value: "baldrick@lousydeal.com"}
            - {name: MERCHANT_PHONE_NUMBER, value: "+372 51 35463"}
            - {name: MERCHANT_REGISTRY_CODE, value: "17584979"}
            - {name: MERCHANT_VAT_NUMBER, value: EE103022558}
            # `SMTP_HOST`, `SMTP_PORT`, `SMTP_TLS_SERVERNAME`, `SMTP_FROM_NAME`,
            # `SMTP_ENVELOPE_FROM`, `SMTP_USERNAME`, `SMTP_PASSWORD` and
            # `SITE_BASE_URL` are deliberately absent from this base, and all of
            # them arrive with C11's Orange patch.
            #
            # **Not placeholders**, which is the choice worth stating. A base
            # carrying a placeholder `SMTP_HOST` would give
            # `readSmtpRuntimeConfig` a complete-looking set, and the
            # subscriber would attempt a send per order against a host that is
            # not there -- a failure logged as "the transport refused" rather
            # than as "this deployment cannot send mail". With none of them
            # set, that reader answers `null`, the notification module is not
            # registered at all, and the subscriber logs `missing a mail
            # transport` once per order, which is the true statement.
            #
            # `SITE_BASE_URL` is absent for a second reason as well. The six
            # above are committed because they are the same in both
            # environments -- there is one company -- while a base URL is
            # exactly what differs between them, so a value here would be wrong
            # for one of the two.
          # Readiness gates this Deployment's own rolling update, not traffic:
          # the worker has no Service (T13a) and sits behind no ingress path.
          # Argo CD also reads this condition -- it assesses Deployment health
          # from `availableReplicas`/the `Available` condition, which is
          # readiness-derived, and T15's gated sync acts on that health. On
          # `replicas: 1` with the `strategy:` pinned above
          # (`maxUnavailable: 0`), a new pod that never turns Ready blocks
          # `kubectl`/Argo CD from retiring the old one -- the one thing this
          # buys is that a broken image or a missing dependency cannot
          # silently replace a working worker.
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          # `/health` is `res.status(200).send("OK")`
          # (`@medusajs/medusa/dist/commands/start.js:245`), unconditional --
          # Medusa's own comment, one line above at `:244`: "Ideally this also
          # checks the readiness of the service, rather than just returning a
          # static response." Measured, not assumed: with this container's
          # Redis stopped mid-run, `/health` kept answering `200` while the
          # Redis client logged `ENOTFOUND` underneath -- it does not read
          # Redis or PostgreSQL. A crashed process needs no probe: the kubelet
          # restarts any container that exits on its own regardless (measured
          # -- `SIGKILL` on the `node` child took the container down by itself,
          # `Exited (137)`). This liveness probe's only marginal value is the
          # *wedge* case -- a process that neither exits nor answers (measured
          # -- `SIGSTOP` on the same child left the container `Up` and silent,
          # `/health` timing out rather than erroring). It cannot fire on a
          # Redis outage either way, because it is measured not to read Redis
          # at all, so it cannot turn one into the `CrashLoopBackOff` that
          # `redis:preflight` (T5) would otherwise cause by refusing every
          # restart while Redis stays down. Same endpoint and thresholds as
          # `backend.yaml`: both
          # run the identical `npm run start` boot chain, and three measured
          # runs of this image under `MEDUSA_WORKER_MODE=worker` reached
          # "Server is ready on port: 9000" in 2.81-2.86s against a real
          # PostgreSQL and Redis -- these thresholds clear that with the same
          # margin the backend's do. See `lousydeal/README.md` for the run.
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
