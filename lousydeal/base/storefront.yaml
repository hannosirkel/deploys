---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lousydeal-storefront
  labels: &labels
    app.kubernetes.io/name: lousydeal-storefront
    app.kubernetes.io/component: storefront
    app.kubernetes.io/part-of: lousydeal
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lousydeal-storefront
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: storefront
          image: ghcr.io/hannosirkel/lousydeal-storefront:unpublished
          imagePullPolicy: IfNotPresent
          # No `args:`, deliberately. `storefront/Dockerfile` ships `CMD
          # ["node", "server.js"]` with every package manager removed from the
          # image and `ENTRYPOINT` cleared, and its own comment says the
          # expectation directly: "a later row's manifests are expected to
          # declare neither command: nor args: beyond that." Naming `args`
          # here would only restate the image's own `CMD`.
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          env:
            # The comment this replaces said the storefront reads exactly three
            # variables and that there is "no MERCHANT_* field -- no row in
            # this slice renders an imprint". LD-09 rendered four legal
            # documents, so that is no longer true:
            # `storefront/src/config/runtime-config.ts` now reads nine, the
            # three below plus six `MERCHANT_*`.
            #
            # There is still no SITE_*, no redirect map, no external-link id
            # and no CORS variable here: this backend image does not read
            # `STORE_CORS`/`ADMIN_CORS`/`AUTH_CORS` (`backend/src/config/
            # runtime.ts` requires neither), so declaring them on any workload
            # in this base would be configuration nothing reads.
            - {name: MEDUSA_BACKEND_URL, value: "http://lousydeal-backend:9000"}
            - name: MEDUSA_PUBLISHABLE_API_KEY
              valueFrom: {secretKeyRef: {name: lousydeal-publishable-key, key: publishableKey}}
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom: {secretKeyRef: {name: lousydeal-runtime-credentials, key: STRIPE_PUBLISHABLE_KEY}}
            # The trader details a customer must be able to find. The contract's
            # §2b records these three and says committing them "is a deliberate
            # §2a decision rather than an oversight": they are public
            # business-register facts and a role address, not a person's contact
            # details. They are also the same in both environments, because
            # there is one company -- so they belong here and not in an overlay,
            # where two copies of one fact would drift.
            #
            # **All six are values, and none is a secret.** V14 put the
            # registry code and the VAT number behind an optional
            # `secretKeyRef`, because §2b said they were each their own
            # decision and had not been decided. The operator decided on
            # 2026-09-06 and the answer is `deploys/plepic`'s, which publishes
            # the same three as literals:
            #
            #   Article 6(1) CRD as amended by Directive (EU) 2019/2161 and
            #   VÕS § 54^1 oblige a trader to publish its name, registered
            #   address, contact address and telephone number, and Article
            #   5(1)(d) of Directive 2000/31/EC obliges it to name the register
            #   and its code within it. Each has exactly one correct value, the
            #   law's requirement is that it be *published*, and a reserved
            #   placeholder in one of these fields is a legally required
            #   disclosure that is wrong rather than a secret withheld.
            #
            # Withholding two of them protected nothing and left the imprint
            # publishing `[REGISTRY CODE NOT CONFIGURED]` in both environments.
            #
            # They are in the base and not in an overlay because there is one
            # company: the overlays differ where the *deployment* differs --
            # names, ports, storage, Secret references -- and the registered
            # identity of the company behind the shop is not one of those.
            - {name: MERCHANT_LEGAL_NAME, value: "Aislopica OÜ"}
            - {name: MERCHANT_ADDRESS, value: "Pihlaka tn 2, Jüri alevik, Rae vald, Harju maakond, 75301, Estonia"}
            - {name: MERCHANT_EMAIL, value: "baldrick@lousydeal.com"}
            - {name: MERCHANT_PHONE_NUMBER, value: "+372 51 35463"}
            - {name: MERCHANT_REGISTRY_CODE, value: "17584979"}
            - {name: MERCHANT_VAT_NUMBER, value: EE103022558}
          # Readiness renders the real page: `src/app/page.tsx` calls the
          # store API through the same-origin proxy, so a pod that cannot
          # reach a working backend is correctly pulled from the Service
          # endpoints -- the same reasoning the reference applies to its own
          # readiness probe.
          #
          # Liveness must not share that path, for the same reason the
          # reference's does not: a backend hiccup would restart a Next.js
          # process that was never unhealthy. The reference's liveness probe
          # is `GET /robots.txt`, generated per request with no backend call --
          # this repository has no such route (`ls storefront/src/app` carries
          # no `robots.ts`, and none is in this row's Files list to add), so
          # `GET /` is not available as a backend-free liveness check here.
          # A TCP check on the same port the readiness probe already proves is
          # serving keeps the invariant -- "liveness never depends on the
          # backend" -- without inventing an HTTP route no code in this
          # repository declares.
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
