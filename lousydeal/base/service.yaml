---
apiVersion: v1
kind: Service
metadata:
  name: lousydeal-postgresql
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: lousydeal-postgresql}
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: lousydeal-redis
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: lousydeal-redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis, protocol: TCP}
---
# No `externalIPs` here, unlike the reference's backend Service. Target
# Exposure in `docs/working/ld-01-foundation.md` states the Medusa Admin
# carries "no public hostname, in any encoding, never in LD-01" -- the
# reference's own backend Service carries the shared WireGuard address
# specifically so an operator can reach its Admin (`deploys/plepic/README.md`:
# "exposes ... the backend on WireGuard port 8102"), which is exactly the
# encoding this plan forbids. A ClusterIP with no external route is what makes
# that true rather than merely stated: nothing outside the cluster's pod
# network has any path to this Service at all, and `allow-backend-ingress`
# below admits only the storefront's own proxy, not a private/administrative
# CIDR the way the reference's does.
apiVersion: v1
kind: Service
metadata:
  name: lousydeal-backend
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: lousydeal-backend}
  ports:
    - {name: http, port: 9000, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: lousydeal-storefront
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  type: ClusterIP
  externalIPs: [192.168.21.2]
  selector: {app.kubernetes.io/name: lousydeal-storefront}
  ports:
    - {name: http, port: 3000, targetPort: http, protocol: TCP}
