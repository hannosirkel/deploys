---
apiVersion: v1
kind: Service
metadata:
  name: lousydeal-postgresql
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: lousydeal-postgresql}
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: lousydeal-redis
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: lousydeal-redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis, protocol: TCP}
---
# Decision 010 reverses this Service's original no-`externalIPs` posture:
# the Admin is now reachable, gated behind Cloudflare Access rather than
# withheld at the network layer entirely
# (`https://github.com/hannosirkel/lousydeal/blob/main/docs/decisions/010-the-admin-is-reachable-and-gated.md`).
# `externalIPs` carries the one shared WireGuard address, the same encoding
# the reference's own backend Service uses so an operator can reach its Admin
# (`deploys/plepic/README.md`: "exposes ... the backend on WireGuard port
# 8102"). The Service's own `port` stays the container's default (9000, see
# `base/backend.yaml`) -- each overlay patches it to this application's own
# slot on that address (`overlays/{live,test}/kustomization.yaml`), the same
# way `lousydeal-storefront` below is patched, so the raw container port never
# reaches the shared address: every application/environment pair on it must
# stay unique, and 9000 is not a value any row here has registered.
# `allow-backend-ingress` carries the network half of the same reversal: a
# rule admitting the base CIDR this decision accepts, added after the
# storefront's own rule rather than in place of it.
apiVersion: v1
kind: Service
metadata:
  name: lousydeal-backend
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  type: ClusterIP
  externalIPs: [192.168.21.2]
  selector: {app.kubernetes.io/name: lousydeal-backend}
  ports:
    - {name: http, port: 9000, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: lousydeal-storefront
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  type: ClusterIP
  externalIPs: [192.168.21.2]
  selector: {app.kubernetes.io/name: lousydeal-storefront}
  ports:
    - {name: http, port: 3000, targetPort: http, protocol: TCP}
