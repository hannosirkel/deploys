---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lousydeal
resources:
  - ../../base
# Both images start on the all-zero SHA-256 sentinel, naming an image that was
# never built -- it is not deployable in the only sense this repository can
# guarantee, because a workload that reaches a cluster on it fails to pull
# rather than running some wrong version. T12 (`lousydeal` repository) has yet
# to add its `scripts/update-gitops-digest.sh` -- T12 runs after this row --
# and it is to rewrite the two `digest:` lines below on merge to `main`;
# nothing else in this repository is to edit them by hand. Each entry carries
# exactly `name`, `newName` and `digest` -- no fourth key -- matching the
# three-line block the `plepic` (not `deploys/plepic`) repository's
# `scripts/update-gitops-digest.sh:221-235` already matches per image for the
# reference, refusing the whole file if it cannot find exactly one.
images:
  - name: ghcr.io/hannosirkel/lousydeal-backend
    newName: ghcr.io/hannosirkel/lousydeal-backend
    digest: sha256:076969b4a0145fc07880f8c25e323efb305201f826b12341c095889200edb37e
  - name: ghcr.io/hannosirkel/lousydeal-storefront
    newName: ghcr.io/hannosirkel/lousydeal-storefront
    digest: sha256:70f002364c6d724e1a5ab17e0e77d2a494288ba5ad6bbb3874a416f638c97622
patches:
  # 8121: the next free slot after the reference's 8101/8102 (live) and
  # 8111/8112 (test) and Servitium's 8098/8099 -- all on the one shared
  # WireGuard address `192.168.21.2`, so every application/environment pair
  # needs a cluster-wide-unique port on it.
  - target:
      kind: Service
      name: lousydeal-storefront
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8121
  # 8122: decision 010's backend slot, the next free port after 8121 in this
  # sequence (resolved against `orange/roles/argocd/defaults/main.yml`'s
  # `argocd_lousydeal_reserved_ports` -- Plepic's own reserved-ports table
  # plus every `storefront_port`/`backend_port` Plepic itself registers --
  # neither 8122 nor 8132 below appears in that set). `base/service.yaml` now
  # carries `externalIPs` for the backend, so its container-default port
  # (9000) must not reach the shared address unremapped, the same reason the
  # storefront's own port is patched here rather than left at 3000.
  - target:
      kind: Service
      name: lousydeal-backend
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8122
  # The Service port above changes what the ClusterIP itself answers on --
  # kube-proxy only rewrites the port the Service declares, so the storefront
  # must be told the same value or its own store-API calls stop resolving.
  - target:
      kind: Deployment
      name: lousydeal-storefront
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: lousydeal-storefront
      spec:
        template:
          spec:
            containers:
              - name: storefront
                env:
                  - {name: MEDUSA_BACKEND_URL, value: "http://lousydeal-backend:8122"}
  - target:
      kind: PersistentVolumeClaim
      name: lousydeal-postgresql
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: PersistentVolumeClaim
      name: lousydeal-redis
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: Deployment|StatefulSet|Job
      labelSelector: app.kubernetes.io/part-of=lousydeal
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
