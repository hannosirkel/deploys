---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The only way in. `192.168.0.0/16` is the same placeholder the `plepic` root
# carries: Orange replaces `/spec/ingress/0/from` on the Application with each
# environment's real source ranges from the private inventory, so the rule at
# index 0 must stay the `ipBlock` rule.
#
# The base allows no egress at all. The game calls nothing by itself; the live
# overlay adds the two egress policies that Jev needs, and the test overlay
# adds none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-game-ingress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: game}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {port: 4780, protocol: TCP}
