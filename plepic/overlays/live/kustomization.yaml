---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plepic
resources:
  - ../../base
images:
  - name: ghcr.io/hannosirkel/plepic-backend
    newName: ghcr.io/hannosirkel/plepic-backend
    digest: sha256:cfa53b48f59e6e355c4119219c60a1c5e6d521d9b5c5f6d0e0a34d0249ec21d6
  - name: ghcr.io/hannosirkel/plepic-storefront
    newName: ghcr.io/hannosirkel/plepic-storefront
    digest: sha256:c4ed4780b83aa1b7340d213c7ef8ba94dfee630ea8bc6a575007d272a5a7d872
patches:
  - target:
      kind: Service
      name: plepic-storefront
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8101
  - target:
      kind: Service
      name: plepic-backend
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8102
  - target:
      kind: PersistentVolumeClaim
      name: plepic-postgresql
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
  - target:
      kind: PersistentVolumeClaim
      name: plepic-redis
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: PersistentVolumeClaim
      name: plepic-assets
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: Deployment|StatefulSet|Job
      labelSelector: app.kubernetes.io/part-of=plepic
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
  - target:
      kind: Deployment
      name: plepic-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - {name: DATABASE_NAME, value: plepic}
                  - {name: SMTP_HOST, value: smtp-live.invalid}
  - target:
      kind: Deployment
      name: plepic-storefront
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-storefront
      spec:
        template:
          spec:
            containers:
              - name: storefront
                env:
                  - {name: MEDUSA_BACKEND_URL, value: "http://plepic-backend:8102"}
  - target:
      kind: Deployment
      name: plepic-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - {name: DATABASE_NAME, value: plepic}
                  - {name: SMTP_HOST, value: smtp-live.invalid}
