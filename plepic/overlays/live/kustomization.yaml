---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plepic
resources:
  - ../../base
images:
  - name: ghcr.io/hannosirkel/plepic-backend
    newName: ghcr.io/hannosirkel/plepic-backend
    digest: sha256:d14af62ed3b3cc92b56e7235c0e3b85cab87a23b84810d1381a1a98a1b5e607f
  - name: ghcr.io/hannosirkel/plepic-storefront
    newName: ghcr.io/hannosirkel/plepic-storefront
    digest: sha256:4b45d8ac95225708516af4e0094de3c375d732895f1633be26f4063771a319f7
patches:
  - target:
      kind: Service
      name: plepic-storefront
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8101
  - target:
      kind: Service
      name: plepic-backend
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8102
  - target:
      kind: PersistentVolumeClaim
      name: plepic-postgresql
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
  - target:
      kind: PersistentVolumeClaim
      name: plepic-redis
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: PersistentVolumeClaim
      name: plepic-assets
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: Deployment|StatefulSet|Job
      labelSelector: app.kubernetes.io/part-of=plepic
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
  - target:
      kind: Deployment
      name: plepic-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - {name: DATABASE_NAME, value: plepic}
                  - {name: SMTP_HOST, value: smtp-live.invalid}
  - target:
      kind: Deployment
      name: plepic-storefront
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-storefront
      spec:
        template:
          spec:
            containers:
              - name: storefront
                env:
                  - {name: MEDUSA_BACKEND_URL, value: "http://plepic-backend:8102"}
  - target:
      kind: Deployment
      name: plepic-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - {name: DATABASE_NAME, value: plepic}
                  - {name: SMTP_HOST, value: smtp-live.invalid}
