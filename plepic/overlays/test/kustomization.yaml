---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plepic-test
nameSuffix: -test
resources:
  - ../../base
images:
  - name: ghcr.io/hannosirkel/plepic-backend
    newName: ghcr.io/hannosirkel/plepic-backend
    digest: sha256:18a2fc62d4c062a743e9104654b364127054bfd1ac30af061555cecd76c2a4ce
  - name: ghcr.io/hannosirkel/plepic-storefront
    newName: ghcr.io/hannosirkel/plepic-storefront
    digest: sha256:21a742dcfe8c65ffee866415e521dfa441eea11d1e436a3b0e93ae0ba8fa8814
patches:
  - target:
      kind: Service
      name: plepic-storefront
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8111
  - target:
      kind: Service
      name: plepic-backend
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8112
  - target:
      kind: PersistentVolumeClaim
      name: plepic-postgresql
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: plepic-redis
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: PersistentVolumeClaim
      name: plepic-assets
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: Deployment|StatefulSet|Job
      labelSelector: app.kubernetes.io/part-of=plepic
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  - target:
      kind: StatefulSet
      name: plepic-postgresql
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: plepic-postgresql
      spec:
        template:
          spec:
            containers:
              - name: postgresql
                env:
                  - {name: POSTGRES_APPLICATION_DATABASE, value: plepic_test}
                  - name: POSTGRES_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-database-admin, key: POSTGRES_SUPERUSER_PASSWORD}}
                  - name: POSTGRES_APPLICATION_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: DATABASE_PASSWORD}}
  - target:
      kind: StatefulSet
      name: plepic-redis
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: plepic-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                env:
                  - name: REDIS_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: REDIS_PASSWORD}}
  - target:
      kind: Deployment
      name: plepic-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - {name: DATABASE_HOST, value: plepic-postgresql-test}
                  - {name: DATABASE_NAME, value: plepic_test}
                  - {name: REDIS_HOST, value: plepic-redis-test}
                  - {name: SMTP_HOST, value: smtp-test.invalid}
                  - {name: SMTP_ENVELOPE_FROM, value: orders-test@example.com}
                  - {name: CONTACT_MAIL_RECIPIENT, value: contact-test@example.com}
                  - {name: MERCHANT_LEGAL_NAME, value: "Example Test Games OÜ"}
                  - {name: MERCHANT_REGISTERED_ADDRESS, value: "Test Street 1, Tallinn"}
                  - {name: MERCHANT_CONTACT_ADDRESS, value: legal-test@example.com}
                  - {name: MERCHANT_RETURN_ADDRESS, value: "Test Return Street 2, Tallinn"}
                  - name: DATABASE_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: DATABASE_PASSWORD}}
                  - name: REDIS_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: REDIS_PASSWORD}}
                  - name: COOKIE_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: COOKIE_SECRET}}
                  - name: JWT_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: JWT_SECRET}}
                  - name: SMTP_USERNAME
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: SMTP_USERNAME}}
                  - name: SMTP_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: SMTP_PASSWORD}}
                  - name: NEWSLETTER_API_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: NEWSLETTER_API_KEY}}
                  - name: NEWSLETTER_LIST_ID
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: NEWSLETTER_LIST_ID}}
                  - name: TURNSTILE_SECRET_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: TURNSTILE_SECRET_KEY}}
                  - name: STRIPE_SECRET_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_SECRET_KEY}}
                  - name: STRIPE_WEBHOOK_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_WEBHOOK_SECRET}}
                  - name: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID}}
  - target:
      kind: Deployment
      name: plepic-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - {name: DATABASE_HOST, value: plepic-postgresql-test}
                  - {name: DATABASE_NAME, value: plepic_test}
                  - {name: REDIS_HOST, value: plepic-redis-test}
                  - {name: SMTP_HOST, value: smtp-test.invalid}
                  - {name: SMTP_ENVELOPE_FROM, value: orders-test@example.com}
                  - {name: CONTACT_MAIL_RECIPIENT, value: contact-test@example.com}
                  - {name: MERCHANT_LEGAL_NAME, value: "Example Test Games OÜ"}
                  - {name: MERCHANT_REGISTERED_ADDRESS, value: "Test Street 1, Tallinn"}
                  - {name: MERCHANT_CONTACT_ADDRESS, value: legal-test@example.com}
                  - {name: MERCHANT_RETURN_ADDRESS, value: "Test Return Street 2, Tallinn"}
                  - name: DATABASE_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: DATABASE_PASSWORD}}
                  - name: REDIS_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: REDIS_PASSWORD}}
                  - name: COOKIE_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: COOKIE_SECRET}}
                  - name: JWT_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: JWT_SECRET}}
                  - name: SMTP_USERNAME
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: SMTP_USERNAME}}
                  - name: SMTP_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: SMTP_PASSWORD}}
                  - name: TURNSTILE_SECRET_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: TURNSTILE_SECRET_KEY}}
                  - name: STRIPE_SECRET_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_SECRET_KEY}}
                  - name: STRIPE_WEBHOOK_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_WEBHOOK_SECRET}}
                  - name: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID}}
  - target:
      kind: Deployment
      name: plepic-storefront
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: plepic-storefront
      spec:
        template:
          spec:
            containers:
              - name: storefront
                env:
                  - {name: MEDUSA_BACKEND_URL, value: "http://plepic-backend-test:8112"}
                  # The test environment's own identity. Its canonical host is
                  # also the one entry in its test-hostname list, which is what
                  # makes `isTestHost()` true for every request this deployment
                  # serves and therefore what puts `noindex` on it. Reserved
                  # names; Orange injects the real ones.
                  - {name: SITE_BASE_URL, value: "https://test.example.org"}
                  - {name: SITE_CANONICAL_HOST, value: test.example.org}
                  - {name: SITE_TEST_HOSTNAMES, value: test.example.org}
                  - {name: MERCHANT_LEGAL_NAME, value: "Example Test Games OÜ"}
                  - {name: MERCHANT_REGISTERED_ADDRESS, value: "Test Street 1, Tallinn"}
                  - {name: MERCHANT_CONTACT_ADDRESS, value: legal-test@example.com}
                  - {name: MERCHANT_RETURN_ADDRESS, value: "Test Return Street 2, Tallinn"}
                  - name: MEDUSA_PUBLISHABLE_API_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-publishable-key, key: publishableKey}}
                  - name: STRIPE_PUBLISHABLE_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_PUBLISHABLE_KEY}}
                  - name: TURNSTILE_SITE_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: TURNSTILE_SITE_KEY}}
            # ESO owns this Secret, so it is absent from the Kustomize resource
            # graph and nameSuffix cannot rewrite the base reference.
            volumes:
              - name: redirect-map
                secret:
                  secretName: plepic-test-redirect-map
  - target:
      kind: Job
      name: plepic-predeploy
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: plepic-predeploy
      spec:
        template:
          spec:
            containers:
              - name: predeploy
                env:
                  - {name: DATABASE_HOST, value: plepic-postgresql-test}
                  - {name: DATABASE_NAME, value: plepic_test}
                  - {name: REDIS_HOST, value: plepic-redis-test}
                  - name: DATABASE_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: DATABASE_PASSWORD}}
                  - name: REDIS_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: REDIS_PASSWORD}}
                  - name: MEDUSA_ADMIN_EMAIL
                    valueFrom: {secretKeyRef: {name: plepic-test-database-admin, key: MEDUSA_ADMIN_EMAIL}}
                  - name: MEDUSA_ADMIN_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-database-admin, key: MEDUSA_ADMIN_PASSWORD}}
                  - name: COOKIE_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: COOKIE_SECRET}}
                  - name: JWT_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: JWT_SECRET}}
                  - name: STRIPE_SECRET_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_SECRET_KEY}}
                  - name: STRIPE_WEBHOOK_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_WEBHOOK_SECRET}}
                  - name: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID}}
                  - {name: SMTP_HOST, value: smtp-test.invalid}
                  - {name: SMTP_ENVELOPE_FROM, value: orders-test@example.com}
                  - {name: CONTACT_MAIL_RECIPIENT, value: contact-test@example.com}
                  - {name: MERCHANT_LEGAL_NAME, value: "Example Test Games OÜ"}
                  - {name: MERCHANT_REGISTERED_ADDRESS, value: "Test Street 1, Tallinn"}
                  - {name: MERCHANT_CONTACT_ADDRESS, value: legal-test@example.com}
                  - {name: MERCHANT_RETURN_ADDRESS, value: "Test Return Street 2, Tallinn"}
                  - name: SMTP_USERNAME
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: SMTP_USERNAME}}
                  - name: SMTP_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: SMTP_PASSWORD}}
                  - name: TURNSTILE_SECRET_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: TURNSTILE_SECRET_KEY}}
  - target:
      kind: Job
      name: plepic-catalogue-import
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: plepic-catalogue-import
      spec:
        template:
          spec:
            containers:
              - name: catalogue-import
                env:
                  - {name: DATABASE_HOST, value: plepic-postgresql-test}
                  - {name: DATABASE_NAME, value: plepic_test}
                  - {name: REDIS_HOST, value: plepic-redis-test}
                  # This environment's identity, compared against the one
                  # recorded for the staged archive. A copied patch block that
                  # left this on `live` is what would import a live export here.
                  - {name: CATALOGUE_IMPORT_ENVIRONMENT, value: test}
                  # As with every other ESO-owned Secret reference in this
                  # overlay, replace the base name explicitly.
                  - name: CATALOGUE_IMPORT_ARCHIVE_SHA256
                    valueFrom:
                      secretKeyRef:
                        name: plepic-test-import-expectation
                        key: CATALOGUE_IMPORT_ARCHIVE_SHA256
                  - name: DATABASE_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: DATABASE_PASSWORD}}
                  - name: REDIS_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: REDIS_PASSWORD}}
                  - name: COOKIE_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: COOKIE_SECRET}}
                  - name: JWT_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: JWT_SECRET}}
                  - name: STRIPE_SECRET_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_SECRET_KEY}}
                  - name: STRIPE_WEBHOOK_SECRET
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_WEBHOOK_SECRET}}
                  - name: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID}}
                  - {name: SMTP_HOST, value: smtp-test.invalid}
                  - {name: SMTP_ENVELOPE_FROM, value: orders-test@example.com}
                  - {name: CONTACT_MAIL_RECIPIENT, value: contact-test@example.com}
                  - {name: MERCHANT_LEGAL_NAME, value: "Example Test Games OÜ"}
                  - {name: MERCHANT_REGISTERED_ADDRESS, value: "Test Street 1, Tallinn"}
                  - {name: MERCHANT_CONTACT_ADDRESS, value: legal-test@example.com}
                  - {name: MERCHANT_RETURN_ADDRESS, value: "Test Return Street 2, Tallinn"}
                  - name: SMTP_USERNAME
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: SMTP_USERNAME}}
                  - name: SMTP_PASSWORD
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: SMTP_PASSWORD}}
                  - name: TURNSTILE_SECRET_KEY
                    valueFrom: {secretKeyRef: {name: plepic-test-runtime-credentials, key: TURNSTILE_SECRET_KEY}}
