---
apiVersion: batch/v1
kind: Job
metadata:
  name: plepic-predeploy
  labels: &labels
    app.kubernetes.io/name: plepic-predeploy
    app.kubernetes.io/component: predeploy
    app.kubernetes.io/part-of: plepic
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: *labels
    spec:
      restartPolicy: Never
      serviceAccountName: plepic-predeploy
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: predeploy
          image: ghcr.io/hannosirkel/plepic-backend:unpublished
          imagePullPolicy: IfNotPresent
          args: [npm, run, predeploy]
          env:
            - {name: DATABASE_HOST, value: plepic-postgresql}
            - {name: DATABASE_PORT, value: "5432"}
            - {name: DATABASE_NAME, value: plepic}
            - {name: DATABASE_USER, value: medusa}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: DATABASE_PASSWORD}}
            # Redis, from the same Service and the same Secret key the two
            # Deployments read. `medusa exec` boots the whole module container —
            # `skipLoadingEntryPoints` skips routes and subscribers, not modules
            # — and the Redis event bus and workflow engine connect eagerly at
            # module load. A Job without these does not degrade to an in-process
            # bus; ioredis retries forever inside this Sync hook at wave -10,
            # and the sync gate blocks every wave behind it.
            - {name: REDIS_HOST, value: plepic-redis}
            - {name: REDIS_PORT, value: "6379"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: REDIS_PASSWORD}}
            - name: MEDUSA_ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: plepic-database-admin, key: MEDUSA_ADMIN_EMAIL}}
            - name: MEDUSA_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: plepic-database-admin, key: MEDUSA_ADMIN_PASSWORD}}
            # The migration Job runs the backend image and loads the same
            # configuration at module scope, so it needs the same session secrets
            # the two Deployments read — from the same Secret, under the same
            # keys. This is a Sync hook, and the wave is what gates it: data
            # services are -20, this Job is -10, and every Deployment and the
            # import Job is 0 — so a configuration this Job cannot construct
            # fails the sync before any application pod is created.
            - name: COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: COOKIE_SECRET}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: JWT_SECRET}}
            # Empty on purpose — see backend.yaml.
            - {name: STORE_CORS, value: ""}
            - {name: ADMIN_CORS, value: ""}
            - {name: AUTH_CORS, value: ""}
            - name: STRIPE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: STRIPE_SECRET_KEY}}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: STRIPE_WEBHOOK_SECRET}}
            - name: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID}}
            - {name: SMTP_HOST, value: smtp.invalid}
            - {name: SMTP_PORT, value: "587"}
            - {name: SMTP_ENVELOPE_FROM, value: orders@example.com}
            - {name: SMTP_FROM_NAME, value: Plepic Games}
            - {name: CONTACT_MAIL_RECIPIENT, value: contact@example.com}
            # The merchant's registered identity, which is a published legal
            # disclosure rather than a placeholder. See `README.md` and the
            # MERCHANT_IDENTITY block in `tests/manifests.sh`: Article 6(1) CRD
            # and VÕS § 54¹ oblige the trader to publish these, so there is one
            # correct value per field, it is the same in every environment, and
            # the test overlay deliberately no longer overrides it. The reserved
            # placeholders above it — the SMTP host, the envelope sender, the
            # contact recipient — stay reserved and are still per-environment
            # configuration Orange supplies.
            - {name: MERCHANT_LEGAL_NAME, value: "Plepic Games OÜ"}
            - {name: MERCHANT_REGISTERED_ADDRESS, value: "Harju maakond, Rae vald, Jüri alevik, Pihlaka tn 2, 75301"}
            - {name: MERCHANT_CONTACT_ADDRESS, value: info@plepicgames.com}
            - {name: MERCHANT_RETURN_ADDRESS, value: "Harju maakond, Rae vald, Jüri alevik, Pihlaka tn 2, 75301"}
            - name: SMTP_USERNAME
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: SMTP_USERNAME}}
            - name: SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: SMTP_PASSWORD}}
            - name: TURNSTILE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: TURNSTILE_SECRET_KEY}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # Ten empty directories, one `emptyDir` and ten `subPath`s.
            #
            # `medusa db:migrate` runs Mikro-ORM's Migrator, and `Migrator.up()`
            # calls `ensureMigrationsDirExists()` at least once for every module
            # *and* every provider it loads — each gets its own migrations
            # directory, derived from its own discovery path, which is why seven
            # of the ten entries below are providers rather than modules. It is
            # more often than once each: `migrationScripts` in
            # `@medusajs/modules-sdk`'s `load-internal.js` accumulates across
            # loaded services and the build loop re-walks the whole accumulator
            # each pass. The count is not what matters here.
            #
            # That call does not tolerate a missing directory
            # — it *creates* it — so every package in this application's module
            # set that ships no `dist/migrations` failed against the read-only
            # root filesystem below, and this Job exited 1 *after* 176
            # migrations across 121 tables had already applied. Modules whose
            # packages do ship `dist/migrations` migrated fine.
            #
            # An empty directory is the whole requirement: the migrator globs
            # it, finds nothing, and reports the module up to date. `readOnly`
            # is correct because `db:migrate` never writes here — only
            # `db:generate` does, and that never runs in-cluster. Relaxing
            # `readOnlyRootFilesystem` would also make the symptom disappear and
            # is rejected: this Job holds the admin, database, Stripe and JWT
            # secrets and is the worst container in the deployment to soften.
            #
            # **This list is coupled to the application's module and provider
            # set, not to the error log.** The log names only the *first*
            # missing directory per module, so `locking` and `file` each hide a
            # second one, and `MODULE: notification` is not `notification-local`
            # — `backend/medusa-config.ts` loads `notificationModule(runtime.smtp)`,
            # whose provider resolves to `./src/notifications`, the
            # application's own SMTP provider, which ships no `migrations`
            # directory and lives under `/app` rather than `/node_modules`.
            # Adding a module or provider whose package ships no migrations
            # directory reproduces the failure and needs another entry here and
            # in `plepic/tests/manifests.sh`.
            #
            # Only this Job needs them. The two Deployments and the import Job
            # run the same image and never invoke the Migrator; the test suite
            # refuses these mounts anywhere else.
            - {name: module-migrations, mountPath: /node_modules/@medusajs/payment-stripe/dist/migrations, subPath: payment-stripe, readOnly: true}
            - {name: module-migrations, mountPath: /node_modules/@medusajs/auth-emailpass/dist/migrations, subPath: auth-emailpass, readOnly: true}
            - {name: module-migrations, mountPath: /node_modules/@medusajs/fulfillment-manual/dist/migrations, subPath: fulfillment-manual, readOnly: true}
            - {name: module-migrations, mountPath: /node_modules/@medusajs/cache-inmemory/dist/migrations, subPath: cache-inmemory, readOnly: true}
            - {name: module-migrations, mountPath: /node_modules/@medusajs/event-bus-redis/dist/migrations, subPath: event-bus-redis, readOnly: true}
            - {name: module-migrations, mountPath: /node_modules/@medusajs/locking/dist/migrations, subPath: locking, readOnly: true}
            - {name: module-migrations, mountPath: /node_modules/@medusajs/locking-redis/dist/migrations, subPath: locking-redis, readOnly: true}
            - {name: module-migrations, mountPath: /node_modules/@medusajs/file/dist/migrations, subPath: file, readOnly: true}
            - {name: module-migrations, mountPath: /node_modules/@medusajs/file-local/dist/migrations, subPath: file-local, readOnly: true}
            - {name: module-migrations, mountPath: /app/src/notifications/migrations, subPath: notifications, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: module-migrations
          emptyDir: {}
