---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storefront-ingress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: storefront}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {port: 3000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: backend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {port: 9000, protocol: TCP}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: storefront}
      ports:
        - {port: 9000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql-ingress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: postgresql}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: backend}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: worker}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: predeploy}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: catalogue-import}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: backup}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: recovery}}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: redis}
  policyTypes: [Ingress]
  # The two Jobs are here for the same reason they are on the PostgreSQL
  # policies: they run the backend image and load the same module container,
  # whose event bus and workflow engine open a Redis connection at module
  # scope. Admitting only the two Deployments left a Sync hook that could
  # construct its configuration and never finish connecting.
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/component: backend}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: worker}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: predeploy}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: catalogue-import}}
      ports:
        - {port: 6379, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, worker, predeploy, catalogue-import, backup, recovery]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: postgresql}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, worker, predeploy, catalogue-import]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: redis}
      ports:
        - {port: 6379, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storefront-backend-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: storefront}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: backend}
      ports:
        - {port: 9000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smtp-submission-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 192.168.255.254/32}
      ports:
        - {port: 587, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  # `backup` is here and `recovery` is deliberately not. Orange's `backups`
  # Application renders backup Jobs into these namespaces labelled
  # `app.kubernetes.io/component: backup`; they dump PostgreSQL — which
  # `allow-postgresql-egress` already admits — and then upload to Backblaze B2
  # over TCP 443, which only this rule can allow. The restore path fetches and
  # decrypts its object on the Ansible controller and mounts it into the Job
  # from a hostPath, so a `recovery` Pod needs 5432 and nothing else, and this
  # peer is `0.0.0.0/0`.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, worker, storefront, predeploy, catalogue-import, backup]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {port: 443, protocol: TCP}
