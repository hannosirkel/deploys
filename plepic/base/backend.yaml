---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plepic-backend
  labels: &labels
    app.kubernetes.io/name: plepic-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: plepic
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plepic-backend
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/hannosirkel/plepic-backend:unpublished
          imagePullPolicy: IfNotPresent
          args: [npm, run, start]
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - {name: NODE_ENV, value: production}
            - {name: MEDUSA_WORKER_MODE, value: server}
            - {name: DATABASE_HOST, value: plepic-postgresql}
            - {name: DATABASE_PORT, value: "5432"}
            - {name: DATABASE_NAME, value: plepic}
            - {name: DATABASE_USER, value: medusa}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: DATABASE_PASSWORD}}
            - {name: REDIS_HOST, value: plepic-redis}
            - {name: REDIS_PORT, value: "6379"}
            - {name: NEWSLETTER_RATE_LIMIT_MAX, value: "20"}
            - {name: NEWSLETTER_RATE_LIMIT_WINDOW_SECONDS, value: "600"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: REDIS_PASSWORD}}
            - name: COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: COOKIE_SECRET}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: JWT_SECRET}}
            # Empty on purpose, and declared rather than omitted. Nothing reaches
            # this backend cross-origin: the storefront proxies the allowlisted
            # /store-api prefixes from its own origin and Admin is served by the
            # backend itself, so an allowed origin here would be a public
            # hostname this repository must not carry and an exposure the plan
            # forbids. Declaring the empty value keeps the intent auditable while
            # leaving the image's requirement fail-closed, so a workload that
            # simply forgot these still refuses to start.
            - {name: STORE_CORS, value: ""}
            - {name: ADMIN_CORS, value: ""}
            - {name: AUTH_CORS, value: ""}
            - {name: SMTP_HOST, value: smtp.invalid}
            - {name: SMTP_PORT, value: "587"}
            - {name: SMTP_ENVELOPE_FROM, value: orders@example.com}
            - {name: CONTACT_MAIL_RECIPIENT, value: contact@example.com}
            # The merchant's registered identity, which is a published legal
            # disclosure rather than a placeholder. See `README.md` and the
            # MERCHANT_IDENTITY block in `tests/manifests.sh`: Article 6(1) CRD
            # and VÕS § 54¹ oblige the trader to publish these, so there is one
            # correct value per field, it is the same in every environment, and
            # the test overlay deliberately no longer overrides it. The reserved
            # placeholders above it — the SMTP host, the envelope sender, the
            # contact recipient — stay reserved and are still per-environment
            # configuration Orange supplies.
            - {name: MERCHANT_LEGAL_NAME, value: "Plepic Games OÜ"}
            - {name: MERCHANT_REGISTERED_ADDRESS, value: "Harju maakond, Rae vald, Jüri alevik, Pihlaka tn 2, 75301"}
            - {name: MERCHANT_CONTACT_ADDRESS, value: info@plepicgames.com}
            - {name: MERCHANT_RETURN_ADDRESS, value: "Harju maakond, Rae vald, Jüri alevik, Pihlaka tn 2, 75301"}
            - name: SMTP_USERNAME
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: SMTP_USERNAME}}
            - name: SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: SMTP_PASSWORD}}
            - name: NEWSLETTER_API_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: NEWSLETTER_API_KEY}}
            - name: NEWSLETTER_LIST_ID
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: NEWSLETTER_LIST_ID}}
            - name: TURNSTILE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: TURNSTILE_SECRET_KEY}}
            - name: STRIPE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: STRIPE_SECRET_KEY}}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: STRIPE_WEBHOOK_SECRET}}
            - name: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: STRIPE_PAYMENT_METHOD_CONFIGURATION_ID}}
          readinessProbe: &probe
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            <<: *probe
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: assets, mountPath: /app/static, subPath: media}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: assets
          persistentVolumeClaim: {claimName: plepic-assets}
        - name: tmp
          emptyDir: {}
