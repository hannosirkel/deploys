---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plepic-storefront
  labels: &labels
    app.kubernetes.io/name: plepic-storefront
    app.kubernetes.io/component: storefront
    app.kubernetes.io/part-of: plepic
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plepic-storefront
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: storefront
          image: ghcr.io/hannosirkel/plepic-storefront:unpublished
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          env:
            - {name: NODE_ENV, value: production}
            # The operator redirect map is projected from its purpose-specific
            # Secret below. The application memoizes the parsed file, so replacing
            # Secret data requires a storefront rollout restart.
            - {name: REDIRECT_MAP_PATH, value: /var/run/plepic/redirect-map/redirect-map.json}
            # The site's own identity, and reserved placeholders for all three.
            #
            # `storefront/src/config/hosts.ts` reads these and falls back to
            # `https://example.com` when SITE_BASE_URL is absent, so an
            # unconfigured deployment does not fail — it silently emits
            # example.com as every canonical URL, `og:url`, sitemap entry and
            # `hreflang` alternate, and `isTestHost()` answers false for every
            # request, which is how a test environment ships without `noindex`.
            # Declaring all three is what makes an overlay that drops one a
            # contract failure instead of that.
            #
            # The values are RFC 2606 reserved names, exactly as every address
            # in this repository is: the real per-environment hostnames are
            # injected from Orange and never rendered here.
            - {name: SITE_BASE_URL, value: "https://example.com"}
            - {name: SITE_CANONICAL_HOST, value: example.com}
            # Empty on purpose, and declared rather than omitted — the same
            # reasoning as the three CORS variables in backend.yaml. Live has no
            # unindexed hostname, and `readEnvList` treats an empty value and an
            # absent one identically, so the only difference declaring it makes
            # is to a reader: "live indexes everything" is then a stated
            # decision rather than an omission nobody can date. The test overlay
            # replaces this with its own hostname; that asymmetry is a value
            # difference visible in a diff, not a presence difference.
            - {name: SITE_TEST_HOSTNAMES, value: ""}
            - {name: MEDUSA_BACKEND_URL, value: "http://plepic-backend:9000"}
            # The merchant's registered identity — all seven values, in the
            # base, with no overlay override in either environment.
            #
            # These are not placeholders and they are not credentials. Article
            # 6(1) CRD as amended by Directive (EU) 2019/2161 and VÕS § 54¹
            # oblige the trader to publish the name, registered address,
            # contact address and telephone number; Article 5(1)(d) of
            # Directive 2000/31/EC obliges it to name the register and the code
            # within it. A value whose disclosure is the legal requirement
            # cannot be reserved, and the reserved form of it is a legally
            # required disclosure that is wrong.
            #
            # They live here rather than in the two overlays because there is
            # one merchant. The overlays differ where the *deployment* differs —
            # names, ports, storage, Secret references, hostnames — and the
            # registered identity of the company behind the shop is not one of
            # those. `MERCHANT_LEGAL_NAME` and the three below it were
            # previously overridden in `overlays/test` with a second, invented
            # company; those overrides are deliberately gone, so the test
            # environment renders the imprint that will be served, which is the
            # only version of that page worth checking before it is public. The
            # test storefront is `noindex` on every hostname it answers to, so
            # it is not a second public imprint.
            #
            # The three below the first four reached no manifest in this
            # repository at all. The storefront resolves each to `null` when
            # absent and renders `[not configured: …]` in the imprint's prose
            # plus a page-level incompleteness notice — a page that says out
            # loud it is incomplete, rather than a crash. That is what kept
            # `content/schema.ts` refusing to mark any legal page
            # `operator-approved`.
            #
            # Storefront only, for the last three: `backend/src/config/runtime.ts`
            # requires the first four and reads none of the others, so a copy on
            # a backend-image workload would be a declaration nothing reads.
            - {name: MERCHANT_LEGAL_NAME, value: "Plepic Games OÜ"}
            - {name: MERCHANT_REGISTERED_ADDRESS, value: "Harju maakond, Rae vald, Jüri alevik, Pihlaka tn 2, 75301"}
            - {name: MERCHANT_CONTACT_ADDRESS, value: info@plepicgames.com}
            - {name: MERCHANT_RETURN_ADDRESS, value: "Harju maakond, Rae vald, Jüri alevik, Pihlaka tn 2, 75301"}
            - {name: MERCHANT_REGISTRATION_NUMBER, value: "14663721"}
            - {name: MERCHANT_VAT_NUMBER, value: EE102137075}
            - {name: MERCHANT_PHONE_NUMBER, value: "+372 51 35463"}
            # MEDUSA_PUBLISHABLE_API_KEY, not MEDUSA_PUBLISHABLE_KEY. The
            # storefront reads the former —
            # `storefront/src/config/runtime-env.ts`'s RUNTIME_ENV_VARS,
            # `runtime-config.ts`, and `lib/medusa-client.ts`, which throws
            # `MEDUSA_PUBLISHABLE_API_KEY is required for Store API requests`.
            # The Secret name and key are unchanged; only this manifest's
            # variable name was wrong, and every Store API call would have
            # failed on it.
            - name: MEDUSA_PUBLISHABLE_API_KEY
              valueFrom: {secretKeyRef: {name: plepic-publishable-key, key: publishableKey}}
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: STRIPE_PUBLISHABLE_KEY}}
            - name: TURNSTILE_SITE_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: TURNSTILE_SITE_KEY}}
          # Readiness asks the real question -- can this pod serve the shop --
          # so it stays on `/`, and a storefront that cannot render its
          # catalogue is correctly pulled from the Service endpoints.
          #
          # Liveness must not, and the two probes no longer share a definition.
          # `/` renders the catalogue, which reaches Medusa: it fails when the
          # store has no product, or more than one region, or when the backend
          # is briefly slow. None of those is cured by killing the container,
          # and restarting on them turns an ordinary change made in Medusa
          # Admin into a CrashLoopBackOff with growing backoff, on a single
          # replica with no PodDisruptionBudget. Liveness therefore asks only
          # whether this Next.js process is alive: `/robots.txt` is generated
          # per request from host configuration and makes no backend call.
          #
          # Both carry an explicit timeout. The default is one second, and a
          # catalogue render now costs two sequential backend round trips, so
          # the default left a GC pause or a cold cache able to flap readiness
          # and -- while liveness was also on `/` -- restart a healthy pod.
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /robots.txt, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
            - {name: redirect-map, mountPath: /var/run/plepic/redirect-map, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        - name: redirect-map
          secret:
            secretName: plepic-redirect-map
            items:
              - {key: redirect-map.json, path: redirect-map.json}
