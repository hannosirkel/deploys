---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plepic-storefront
  labels: &labels
    app.kubernetes.io/name: plepic-storefront
    app.kubernetes.io/component: storefront
    app.kubernetes.io/part-of: plepic
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plepic-storefront
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: storefront
          image: ghcr.io/hannosirkel/plepic-storefront:unpublished
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          env:
            - {name: NODE_ENV, value: production}
            # The operator redirect map is projected from its purpose-specific
            # Secret below. The application memoizes the parsed file, so replacing
            # Secret data requires a storefront rollout restart.
            - {name: REDIRECT_MAP_PATH, value: /var/run/plepic/redirect-map/redirect-map.json}
            # The site's own identity, and reserved placeholders for all three.
            #
            # `storefront/src/config/hosts.ts` reads these and falls back to
            # `https://example.com` when SITE_BASE_URL is absent, so an
            # unconfigured deployment does not fail — it silently emits
            # example.com as every canonical URL, `og:url`, sitemap entry and
            # `hreflang` alternate, and `isTestHost()` answers false for every
            # request, which is how a test environment ships without `noindex`.
            # Declaring all three is what makes an overlay that drops one a
            # contract failure instead of that.
            #
            # The values are RFC 2606 reserved names, exactly as every address
            # in this repository is: the real per-environment hostnames are
            # injected from Orange and never rendered here.
            - {name: SITE_BASE_URL, value: "https://example.com"}
            - {name: SITE_CANONICAL_HOST, value: example.com}
            # Empty on purpose, and declared rather than omitted — the same
            # reasoning as the three CORS variables in backend.yaml. Live has no
            # unindexed hostname, and `readEnvList` treats an empty value and an
            # absent one identically, so the only difference declaring it makes
            # is to a reader: "live indexes everything" is then a stated
            # decision rather than an omission nobody can date. The test overlay
            # replaces this with its own hostname; that asymmetry is a value
            # difference visible in a diff, not a presence difference.
            - {name: SITE_TEST_HOSTNAMES, value: ""}
            - {name: MEDUSA_BACKEND_URL, value: "http://plepic-backend:9000"}
            - {name: MERCHANT_LEGAL_NAME, value: "Example Games OÜ"}
            - {name: MERCHANT_REGISTERED_ADDRESS, value: "Example Street 1, Tallinn"}
            - {name: MERCHANT_CONTACT_ADDRESS, value: legal@example.com}
            - {name: MERCHANT_RETURN_ADDRESS, value: "Return Street 2, Tallinn"}
            # MEDUSA_PUBLISHABLE_API_KEY, not MEDUSA_PUBLISHABLE_KEY. The
            # storefront reads the former —
            # `storefront/src/config/runtime-env.ts`'s RUNTIME_ENV_VARS,
            # `runtime-config.ts`, and `lib/medusa-client.ts`, which throws
            # `MEDUSA_PUBLISHABLE_API_KEY is required for Store API requests`.
            # The Secret name and key are unchanged; only this manifest's
            # variable name was wrong, and every Store API call would have
            # failed on it.
            - name: MEDUSA_PUBLISHABLE_API_KEY
              valueFrom: {secretKeyRef: {name: plepic-publishable-key, key: publishableKey}}
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: STRIPE_PUBLISHABLE_KEY}}
            - name: TURNSTILE_SITE_KEY
              valueFrom: {secretKeyRef: {name: plepic-runtime-credentials, key: TURNSTILE_SITE_KEY}}
          readinessProbe: &probe
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            <<: *probe
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
            - {name: redirect-map, mountPath: /var/run/plepic/redirect-map, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        - name: redirect-map
          secret:
            secretName: plepic-redirect-map
            items:
              - {key: redirect-map.json, path: redirect-map.json}
