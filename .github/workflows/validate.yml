---
name: Validate

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate rendered manifests
        run: |
          set -euo pipefail
          bash servitium/tests/manifests.sh
          kubectl kustomize servitium/overlays/live >/dev/null
          kubectl kustomize servitium/overlays/test >/dev/null
          bash plepic/tests/manifests.sh
          kubectl kustomize plepic/overlays/live >/dev/null
          kubectl kustomize plepic/overlays/test >/dev/null

      - name: Download pinned kubeconform and validate schemas
        env:
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: >-
            9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          # The Orange cluster runs K3s v1.36.2+k3s1, so schemas are resolved
          # for Kubernetes 1.36.2. Without this kubeconform reads whatever
          # kubernetes-json-schema has at `master`, which makes the gate's
          # strictness drift with an upstream repository nobody here controls.
          # Change this when the cluster changes, not before.
          KUBERNETES_VERSION: 1.36.2
        run: |
          set -euo pipefail
          archive="kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${archive}"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" kubeconform
          for overlay in \
            servitium/overlays/live \
            servitium/overlays/test \
            plepic/overlays/live \
            plepic/overlays/test; do
            echo "== kubeconform ${overlay}"
            kubectl kustomize "$overlay" \
              | ./kubeconform \
                  -kubernetes-version "${KUBERNETES_VERSION}" \
                  -strict -summary
          done

      - name: Download pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: >-
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose

  shell:
    name: Shell
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Shell does not announce itself here: two of the three scripts are named
      # `*.sh`, and the third is `.githooks/pre-commit` with no extension.
      # Discover by name and by shebang so a script added later is linted
      # without anyone remembering to extend a list.
      # See standards/languages/shell.md.
      - name: Collect shell files
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do
            case "$f" in
              *.sh|*.bats) files+=("$f"); continue ;;
            esac
            [ -f "$f" ] || continue
            if head -n 1 -- "$f" | grep -qE '^#!.*\b(ba)?sh\b'; then
              files+=("$f")
            fi
          done < <(git ls-files)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell files found; expected at least one." >&2
            exit 1
          fi
          printf 'Shell files to check:\n'
          printf '  %s\n' "${files[@]}"
          printf '%s\n' "${files[@]}" > shell-files.txt

      - name: Shellcheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends shellcheck
          fi
          shellcheck --version
          xargs -a shell-files.txt -d '\n' shellcheck --format=gcc --

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Lint workflows with zizmor
        run: |
          set -euo pipefail
          python -m pip install zizmor==1.29.0
          zizmor --no-progress .github/workflows/

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check layout
        # DavidAnson/markdownlint-cli2-action v24.2.0
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'

      - name: Check links
        # lycheeverse/lychee-action v2.9.0
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --no-progress --config lychee.toml .
          fail: true
